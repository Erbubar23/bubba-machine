name: pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias de los generadores
        run: pip install numpy pillow

      - name: La documentación del sitio está al día con los .md
        run: |
          python tools/gen_site.py
          git diff --exit-code -- web/docs web/en/docs

      - name: Los paquetes de idioma están al día con el código
        run: |
          python tools/gen_lang.py
          git diff --exit-code -- lang web/lang

      - name: Pruebas del núcleo
        run: python tools/build.py test

      - name: Rescate del FM-1 contra un chip simulado
        run: python tests/test_rescate.py
